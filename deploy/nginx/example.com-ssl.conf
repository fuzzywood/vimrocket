# HTTPS: enable after the certificate exists (see DEPLOYMENT.md).

upstream vimrocket_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vimrocket.com;

    ssl_certificate     /etc/letsencrypt/live/vimrocket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vimrocket.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://vimrocket.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vimrocket.com;

    ssl_certificate     /etc/letsencrypt/live/vimrocket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vimrocket.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:vimrocket_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (CSP, HSTS, ...) are set by the application itself.

    client_max_body_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;

    access_log /var/log/nginx/vimrocket.com.access.log;
    error_log /var/log/nginx/vimrocket.com.error.log;

    location / {
        proxy_pass http://vimrocket_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }
}

# HTTP: Let's Encrypt challenges + redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name vimrocket.com www.vimrocket.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://vimrocket.com$request_uri;
    }
}
